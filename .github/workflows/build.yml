name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compila l'APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepara il file
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ScreenAnnotator.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenAnnotator-apk
          path: out/ScreenAnnotator.apk

      - name: Pubblica la release (scarica l'APK dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Screen Annotator build ${{ github.run_number }}
          files: out/ScreenAnnotator.apk
          make_latest: true
